services:
  # ── Infrastructure ────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waldo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waldo}
      POSTGRES_DB: ${POSTGRES_DB:-waldo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - waldo-net

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - waldo-net

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_BIND:-127.0.0.1}:9000:9000"
      - "${MINIO_BIND:-127.0.0.1}:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SERVER_URL: http://localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - waldo-net

  minio-init:
    image: minio/mc
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-waldo}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c 'set -eu;
      mc alias set waldo http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY";
      mc mb --ignore-existing "waldo/$$MINIO_BUCKET";'
    networks:
      - waldo-net

  # ── AI Agent (Ollama serves the LLM for the LangGraph ReAct loop) ──

  ollama:
    image: ollama/ollama:latest
    profiles: [local-chat]
    ports:
      # Expose for host debugging (curl localhost:11434/api/tags). Internal
      # traffic from waldo-app uses the docker network, not this mapping.
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep the model resident so the first chat doesn't pay re-load cost.
      OLLAMA_KEEP_ALIVE: "30m"
    healthcheck:
      # `ollama list` exits 0 only when the local server is reachable. The
      # ollama/ollama image doesn't ship curl/wget, so we use the bundled CLI.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - waldo-net

  # Opt-in model download. Application health is separate from model readiness.
  ollama-init:
    image: ollama/ollama:latest
    profiles: [local-chat]
    environment:
      AGENT_MODEL: ${AGENT_MODEL:-gemma4:e4b}
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c 'set -eu;
        ollama pull "$$AGENT_MODEL";
        echo "Agent model ready.";'
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - waldo-net
    restart: "no"

  # ── Application (FastAPI + UI; no GPU needed) ─────────────
  # Pulls the published image by default. Contributors who want to build
  # from source can layer docker-compose.build.yml on top.

  waldo-app:
    image: ${WALDO_IMAGE:-oldhero5/waldo}:${WALDO_TAG:-latest}
    pull_policy: always
    ports:
      - "${WALDO_BIND:-127.0.0.1}:8000:8000"
    env_file: ${WALDO_ENV_FILE:-.env}
    environment:
      WALDO_ROLE: app
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:9000}
      OLLAMA_URL: ${OLLAMA_COMPOSE_URL:-http://ollama:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - waldo-net

  # ── Workers: Apple Silicon / CPU (no GPU) ──────────────────
  # Activated under both the `cpu` profile (Linux/WSL hosts without an NVIDIA
  # GPU) and the `apple` profile (kept as an alias for one release so existing
  # `make up PROFILE=apple` invocations don't break).

  waldo-labeler:
    image: ${WALDO_IMAGE:-oldhero5/waldo}:${WALDO_TAG:-latest}
    pull_policy: always
    profiles:
      - apple
      - cpu
    env_file: ${WALDO_ENV_FILE:-.env}
    environment:
      WALDO_ROLE: labeler
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DEVICE: cpu
    volumes:
      - model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - waldo-net

  waldo-trainer:
    image: ${WALDO_IMAGE:-oldhero5/waldo}:${WALDO_TAG:-latest}
    pull_policy: always
    profiles:
      - apple
      - cpu
    env_file: ${WALDO_ENV_FILE:-.env}
    environment:
      WALDO_ROLE: trainer
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DEVICE: cpu
    volumes:
      - model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - waldo-net

  # ── Workers: NVIDIA GPU ────────────────────────────────────

  waldo-labeler-nvidia:
    image: ${WALDO_IMAGE:-oldhero5/waldo}:${WALDO_CUDA_TAG:-cuda}
    pull_policy: always
    profiles:
      - nvidia
    env_file: ${WALDO_ENV_FILE:-.env}
    environment:
      WALDO_ROLE: labeler
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DEVICE: cuda
      DTYPE: bfloat16
      # Defense-in-depth: image already sets these, but explicit beats
      # implicit if anyone ever swaps the image.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - model_cache:/root/.cache
    # PyTorch dataloaders default to shared memory for worker IPC. Docker's
    # default /dev/shm is 64MB which OOMs real workloads.
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - waldo-net

  waldo-trainer-nvidia:
    image: ${WALDO_IMAGE:-oldhero5/waldo}:${WALDO_CUDA_TAG:-cuda}
    pull_policy: always
    profiles:
      - nvidia
    env_file: ${WALDO_ENV_FILE:-.env}
    environment:
      WALDO_ROLE: trainer
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DEVICE: cuda
      DTYPE: bfloat16
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - model_cache:/root/.cache
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - waldo-net

volumes:
  pgdata:
  miniodata:
  model_cache:
  ollama_data:

networks:
  waldo-net:
    driver: bridge
