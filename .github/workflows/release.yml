name: Release — publish qualified image pair (disabled)

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Completed trusted main candidate run with successful real CUDA qualification"
        required: true
        type: string
      version:
        description: "Required vMAJOR.MINOR.PATCH; version tags must be absent or match this exact pair"
        required: true
        type: string
      dry_run:
        description: "Validate GitHub custody and artifacts without credentials or registry writes"
        default: true
        type: boolean
      resume_publish_run_id:
        description: "Optional prior publisher run whose release record will resume this same pair"
        required: false
        type: string

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read

concurrency:
  group: waldo-release-publisher
  cancel-in-progress: false

jobs:
  verify:
    name: Verify current main source gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check current main, CI, independent review and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/check-release.sh

  dry-run:
    name: Credential-free artifact validation
    needs: verify
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate trusted producer custody and downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/release_artifacts.py space "$RUNNER_TEMP" 30
          python3 .github/scripts/release_artifacts.py publish "$CANDIDATE_RUN" "$RELEASE_VERSION" \
            --directory "$RUNNER_TEMP/release" --journal "$RUNNER_TEMP/release/journal.json" --dry-run

  publish:
    name: Publish qualified CPU and CUDA pair
    needs: verify
    # Deliberately disabled. Owner must review, qualify real CUDA, provision
    # protected environment credentials, remove repository credential copies,
    # and approve the exact source before changing this condition.
    if: ${{ false }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned OCI copier and scanner
        run: bash .github/scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
      - name: Recheck evidence after protected environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/check-release.sh
      - name: Prepare verified pair intent before registry writes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          RESUME_RUN: ${{ inputs.resume_publish_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          REGCTL_CONFIG: ${{ runner.temp }}/release-regctl.json
        run: |
          python3 .github/scripts/release_artifacts.py space "$RUNNER_TEMP" 50
          mkdir -p "$RUNNER_TEMP/release"
          resume=()
          if [[ -n "$RESUME_RUN" ]]; then resume=(--resume-run "$RESUME_RUN"); fi
          python3 .github/scripts/release_artifacts.py prepare "$CANDIDATE_RUN" "$RELEASE_VERSION" \
            --directory "$RUNNER_TEMP/release" --journal "$RUNNER_TEMP/release/journal.json" "${resume[@]}"
      - name: Save durable prewrite pair intent
        id: intent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-intent
          path: ${{ runner.temp }}/release/journal.json
          if-no-files-found: error
          retention-days: 90
      - name: Recheck trusted artifacts and durable intent, then publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          # Distinct names avoid fallback to legacy repository credentials.
          # Owner must still establish these are environment-only secrets.
          RELEASE_DOCKERHUB_USERNAME: ${{ secrets.RELEASE_DOCKERHUB_USERNAME }}
          RELEASE_DOCKERHUB_TOKEN: ${{ secrets.RELEASE_DOCKERHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/release-docker-auth
          REGCTL_CONFIG: ${{ runner.temp }}/release-regctl.json
        run: |
          python3 .github/scripts/release_artifacts.py publish "$CANDIDATE_RUN" "$RELEASE_VERSION" \
            --directory "$RUNNER_TEMP/release" --journal "$RUNNER_TEMP/release/journal.json"
      - name: Save complete or incomplete release record
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: ${{ runner.temp }}/release/journal.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove ephemeral registry login
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/release-docker-auth"
