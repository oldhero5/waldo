name: Release — build & push images to Docker Hub

# Publishing is manual, from a reviewed and tested main SHA only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version, e.g. v1.2.3; blank publishes :main and :main-cuda"
        required: false
        type: string

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  verify:
    name: Verify release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check current main SHA and required evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/check-release.sh

  build:
    name: ${{ matrix.image.name }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    strategy:
      # Don't cancel cuda just because cpu failed (and vice versa).
      fail-fast: false
      matrix:
        image:
          - name: cpu
            dockerfile: Dockerfile
            tag_suffix: ""
            default_tag: latest
          - name: cuda
            dockerfile: Dockerfile.cuda
            tag_suffix: -cuda
            default_tag: cuda

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Recheck after the release environment approval in case main or a
      # required status changed while the job waited for review.
      - name: Recheck release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/check-release.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Compute tags
        id: tags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE="oldhero5/waldo"
          tags=""
          add() { tags="${tags:+$tags,}$1"; }

          if [ -n "$RELEASE_VERSION" ]; then
            version="${RELEASE_VERSION#v}"
            add "$IMAGE:${version}${{ matrix.image.tag_suffix }}"
            add "$IMAGE:${{ matrix.image.default_tag }}"
          else
            add "$IMAGE:main${{ matrix.image.tag_suffix }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Building tags: $tags"

      # --password-stdin keeps the Docker Hub token out of the process listing.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build & push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # GHA's cache-from/to with type=gha gives us layer reuse across runs
          # without needing a separate registry cache.
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
          provenance: false
