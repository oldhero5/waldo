name: CI — test, lint, build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Test + Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waldo
          POSTGRES_PASSWORD: waldo  # pragma: allowlist secret
          POSTGRES_DB: waldo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: waldo
      POSTGRES_PASSWORD: waldo  # pragma: allowlist secret
      POSTGRES_DB: waldo
      WALDO_TEST_POSTGRES_URL: postgresql://waldo:waldo@localhost:5432/waldo  # pragma: allowlist secret
      WALDO_SERVICE_STACK: "1"
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin  # pragma: allowlist secret
      MINIO_SECURE: "false"
      APP_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Gitleaks needs the entire PR or push commit range.

      # ── System deps (ffmpeg/ffprobe used by lib/frame_extractor + frame_cache) ──
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # ── MinIO (started as a step — GH Actions services can't pass `command:`) ──
      - name: Start MinIO
        env:
          MINIO_ROOT_PASSWORD: minioadmin  # pragma: allowlist secret
        run: |
          docker run -d \
            --name minio \
            --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          # Wait for MinIO to be ready
          timeout 30 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      # ── MinIO bucket (compose's minio-init creates this for the runtime stack;
      #    we mirror it here so tests that store/retrieve via lib.s3 don't 404) ──
      - name: Create MinIO 'waldo' bucket
        run: |
          docker run --rm --network host --entrypoint=/bin/sh quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z -c '
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/waldo
          '

      # ── Python / uv ──────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      # ── Ruff lint + format ───────────────────────────────────────────────────
      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

      # ── Database migrations ──────────────────────────────────────────────────
      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      # ── Pytest ──────────────────────────────────────────────────────────────
      - name: Run pytest
        run: uv run pytest -v --tb=short

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --legacy-peer-deps

      - name: Build UI (type-check + bundle)
        working-directory: ui
        run: npm run build

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      # ── Secret scanning ──────────────────────────────────────────────────────
      - name: Gitleaks — secret scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          printf '%s  %s\n' 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba "$archive" | sha256sum --check
          tar -xz -C "$RUNNER_TEMP" -f "$archive" gitleaks

          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) echo "Unsupported secret-scan event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == push && "$base" == 0000000000000000000000000000000000000000 ]]; then
            # A newly created branch has no previous commit to compare.
            log_opts="--all"
          else
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid scan base SHA" >&2; exit 1; }
            git cat-file -e "$base^{commit}"
            log_opts="$base..HEAD"
            [[ "$(git rev-list --count "$log_opts")" -gt 0 ]] || { echo "Empty secret-scan range" >&2; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "Checkout SHA mismatch" >&2; exit 1; }
          "$RUNNER_TEMP/gitleaks" git --log-opts="$log_opts" --no-banner --redact .

  ui-browser:
    name: UI browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --legacy-peer-deps

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run UI browser smoke tests
        working-directory: ui
        run: npx playwright test -c playwright.smoke.config.ts
